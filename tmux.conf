# Prefix + r lädt die Config neu ohne tmux-Neustart
bind-key r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# $TERM auf tmux-256color setzen — nötig für korrekte Farbdarstellung
set -g default-terminal "tmux-256color"

# True Color (24-bit) für alle Terminals aktivieren — ohne das sehen Colorschemes verwaschen aus
set -ga terminal-overrides ",*:Tc"

# Focus-Events ans Terminal schicken — Neovim braucht das für autoread beim Pane-Wechsel
set-option -g focus-events on

# Statusmeldungen (z.B. nach Prefix+r) in schwarz/grün
set-option -g message-style bg=black,fg=green

# Uhr (Prefix+t) in grün
set-window-option -g clock-mode-colour colour64 #green

# Maus komplett aktivieren: Pane auswählen, scrollen, Fenster umschalten
set -g mouse on

# Copy-Mode wie Vim navigieren (h/j/k/l, / zum Suchen)
setw -g mode-keys vi
# v startet Selektion (wie Visual Mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection
# y kopiert und verlässt Copy-Mode — wird unten durch clip.exe-Variante überschrieben
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# r schaltet zwischen normaler und Rechteck-Selektion (Spaltenauswahl) um
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# y kopiert direkt in Windows-Clipboard via clip.exe (überschreibt die y-Bindung oben)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# Inaktiver Pane-Rahmen: Gruvbox-Grau
set -g pane-border-style fg=#504945
# Aktiver Pane-Rahmen: Gruvbox-Gelb
set -g pane-active-border-style fg=#fabd2f

# Statusbar unten
set-option -g status-position "bottom"
# Gruvbox-Hintergrund mit hellem Vordergrundtext
set-option -g status-style bg=#282828,fg=#ebdbb2
# Fensterliste linksbündig
set-option -g status-justify left

# Links: Session-Name; #{?client_prefix,,   } zeigt nichts wenn Prefix aktiv (visueller Hinweis)
set-option -g status-left '#[bg=#282828,fg=#ffffff,bold]#{?client_prefix,,   }#[bg=#282828,fg=#ffffff,bold]#S '

# Rechts: Nerd-Font-Icon + Uptime (via sed/awk gefiltert) + Uhr-Icon + aktuelle Zeit
set-option -g status-right "#[fg=#ffffff,bold] 󰺓 #(uptime | sed 's/.*up *//; s/,.*user.*//' | awk '{print $1}')  󰔟 %H:%M "

# Inaktive Fenster: Gruvbox-Grau, Format Index:Name
set-option -g window-status-format ' #[fg=#a89984]#I:#W '
# Aktives Fenster: roter Gruvbox-Hintergrund, fett; 󰊓 erscheint wenn Pane gezoomt (Prefix+z)
set-option -g window-status-current-format '#[bg=#cc241d,fg=#ffffff,bold] #I:#W#{?window_zoomed_flag, 󰊓 , } '

# Farben für Pane-Nummern bei Prefix+q — Gruvbox-Blau und Gelb
set -g display-panes-colour "#83a598"
set -g display-panes-active-colour "#fabd2f"

# Escape-Delay auf 0ms — ohne das spürbarer Lag beim Moduswechsel in Vim/Neovim
set -sg escape-time 0

# Scrollback-Buffer auf 100.000 Zeilen (Standard wäre nur 2.000)
set -g history-limit 100000
